name: Release

on:
  push:
    # Tags publish a release. A main push does not publish; it is the Windows
    # compile-and-test gate on the default branch. It used to exist mainly to
    # write the vcpkg binary cache under the default-branch scope, and that cache
    # is gone with the prebuilt Qt bundle - see "Install Qt5 (static)".
    branches:
      - main
    tags:
      - 'v*'
  # A twice-weekly health check of main. This used to double as a keep-alive for
  # the vcpkg binary cache, whose documented retention is seven days from the
  # last access - a quiet month made the next tag build pay the full ~1.5h Qt5
  # compile: the 2026-08-17 run was followed by 5 idle weeks, and the next build
  # took 1h49m51s instead of the usual ~20 minutes. There is no such cache any
  # more, because Qt5 arrives as an immutable pinned bundle, so this is now
  # purely a build-and-test gate. GitHub disables scheduled workflows after 60
  # days without repository activity, which is the only cost of it going quiet.
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

# One build per ref. Never cancel in progress: a tag build creates the GitHub
# release as its last act, so a run killed before that leaves a pushed tag with
# no asset behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The triplet the prebuilt Qt bundle was built for, and the name of the
  # directory inside the extracted install root. `Install Qt5 (static)` and
  # `Configure` both read it, so the two cannot drift apart.
  VCPKG_TRIPLET: x64-windows-static-md

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep
        # Optional: scripts/check-backend-boundaries.ps1 uses rg when it is
        # available and otherwise falls back to an equivalent pure-PowerShell
        # scan, so this only speeds the boundary check up on the runner.
        run: choco install ripgrep -y --no-progress

      - name: Install Qt5 (static)
        id: qt5
        # A pinned prebuilt vcpkg install root instead of running `vcpkg install`
        # here. Qt5 stays statically linked, so the release asset is still one exe
        # with no Qt DLLs beside it - which is why jurplel/install-qt-action (the
        # official, dynamically-linked Qt) is not an alternative worth having: it
        # would turn the release into a bundle that needs windeployqt.
        #
        # Everything this step replaces - cache/restore, the prune, cache/save and
        # the eviction - existed only to hand a ~1.4h vcpkg compile of qt5-base
        # and qt5-svg forwards from one run to the next, and each of those steps
        # had a failure mode of its own (a fixed restore key that matched forever,
        # an image namespace that a fleet rollover defeated, a ~1 GB store that
        # outgrew the repository's budget). o3ku/qt-static publishes that same
        # install root: x64-windows-static-md, exactly the two ports this
        # repository needs, built on this same windows-2022 image. Nothing is left
        # to keep warm, so nothing is cached.
        #
        # The action is pinned to a commit rather than to `@v1`, because a tag can
        # be moved and this step decides what every release binary links against.
        # `tag` is a literal on purpose too: the bundle is immutable and
        # SHA256-verified by the action, so a bump is a visible edit here rather
        # than a silent cache miss, and the tag names the runner image it was
        # built on - the one thing to reconsider if `runs-on` ever moves away from
        # windows-2022.
        uses: o3ku/qt-static@f39a48465c5c788ed5e035f3a4a4e46552a6b423
        with:
          tag: qt5-win2022-20261024-0121
          # The extracted root is what `Configure` passes as VCPKG_INSTALLED_DIR.
          # There is no vcpkg.json in this repository, so the toolchain runs in
          # classic mode: it appends <dir>/<triplet> to CMAKE_PREFIX_PATH and never
          # invokes vcpkg.exe, which is why the shipped vcpkg/status needs no ABI
          # to match and the build needs no write access to the tree.
          #
          # Measured against this tag from a local checkout, so the next person
          # does not have to repeat it: the archive is 434 MB, unpacks to ~4 GB in
          # 34 s, and grep finds no absolute path to the machine that built it
          # anywhere in the tree - so it relocates, and `Qt5_DIR` resolves inside
          # it. The one constraint it carries is a toolset floor: it was compiled
          # against a 14.4x MSVC STL, so its .libs reference runtime symbols
          # (`__std_find_trivial_4`) that VS 2019 does not define - a local link
          # with 14.29 fails on exactly that, which says nothing about the bundle.
          # windows-2022 only moves that toolset forwards, so CI is always at or
          # above it.
          dest: ${{ github.workspace }}/vcpkg_installed

      - name: Set up MSVC
        # Not ilammy/msvc-dev-cmd, which is what this used to be: it has not
        # been touched since 2024-04 and still declares `runs.using: node20`, so
        # the runner now warns on every run that it is forcing the action onto
        # Node 24, and five of its open pull requests ask for exactly that
        # update. This is a maintained drop-in with the same inputs, and it
        # declares `runs.using: node24`.
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          # Unlike the action this replaces, `arch` has no default here, so the
          # target has to be spelled out.
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TEST=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -LE smoke --output-on-failure

      - name: Stage release asset
        shell: pwsh
        run: Copy-Item build/src/SongBird.exe songbird.exe -Force

      # The single exe carries no core and no geodata, so a user whose network
      # cannot reach GitHub -- directly or through one of the three mirrors
      # buildGitHubMirrorCandidateUrls() tries -- ends up with a client that
      # starts and connects to nothing. This stages a second, opt-in asset that
      # bundles the sing-box core and the rule-set databases the built-in
      # routing profiles reference.
      #
      # No application change is needed to consume it: CoreDiscoveryService
      # already looks for the core in the application directory, and
      # SingBoxRoutingConfigFragments::resolveLocalSingBoxRuleSetPath() already
      # prefers <app dir>/rule-set/<tag>.srs over the remote URL. Dropping the
      # unpacked folder next to SongBird.exe is the whole install.
      - name: Stage offline bundle asset
        id: stage-offline-bundle
        # Every other build pulls sing-box and the rule-set files from upstream, and
        # this step throws rather than ship a bundle with a hole in it, so a transient
        # upstream failure would redden a plain main push and the twice-weekly cache
        # keep-alive for reasons that have nothing to do with the commit. A release is
        # the only consumer, so gate it there.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # This step is tag-gated, so the ref is always refs/tags/v<version>.
          $version = '${{ github.ref_name }}' -replace '^v', ''

          $stage = 'offline-bundle'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$stage/rule-set" -Force | Out-Null
          Copy-Item build/src/SongBird.exe "$stage/SongBird.exe" -Force

          # sing-box publishes per-platform archives; the Windows one unwraps to a
          # bare "sing-box.exe", which is exactly the name in
          # SingBoxCoreDescriptor::executableNames and the only core that runs TUIC,
          # AnyTLS and Naive -- so it is the one worth shipping offline.
          $coreTag = gh api "repos/SagerNet/sing-box/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($coreTag)) {
            throw 'Could not resolve the latest sing-box release.'
          }
          $coreTag = $coreTag.Trim()
          $coreAsset = 'sing-box-' + ($coreTag -replace '^v', '') + '-windows-amd64.zip'
          Write-Host "offline bundle: sing-box $coreTag ($coreAsset)"
          gh release download $coreTag --repo SagerNet/sing-box --pattern $coreAsset --output "$stage/core.zip" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download $coreAsset." }
          Expand-Archive -Path "$stage/core.zip" -DestinationPath "$stage/core" -Force
          # The archive holds a top-level directory (sing-box-<version>-windows-amd64)
          # with the executable plus the siblings it needs: libcronet.dll, which the
          # executable imports, and the LICENSE that redistributing it requires.
          # Locate the executable rather than spelling out a layout upstream is free
          # to change -- a hard-coded "core/sing-box.exe" silently stopped matching
          # when the archive grew that directory.
          $coreDir = Get-ChildItem -Path "$stage/core" -Recurse -Filter 'sing-box.exe' -File |
            Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          if (-not $coreDir) {
            throw "$coreAsset did not unpack a sing-box.exe."
          }
          Write-Host "offline bundle: core directory $(Split-Path $coreDir -Leaf)"
          Copy-Item "$coreDir\*" "$stage" -Recurse -Force
          Remove-Item "$stage/core.zip", "$stage/core" -Recurse -Force

          # The rule-set tags are derived rather than hard-coded:
          # RoutingProfiles.cpp is the same source the app reads at runtime, so a
          # list typed into the workflow would drift from it silently. Absent
          # entries are the ones isSingBoxRuleSetPublishedUpstream() drops -- keep
          # the two in step, and fail here loudly when upstream drops a tag so the
          # bundle is never published half-full.
          $text = Get-Content -Raw -LiteralPath 'src/domain/models/RoutingProfiles.cpp'
          if ([string]::IsNullOrWhiteSpace($text)) {
            throw 'Could not read src/domain/models/RoutingProfiles.cpp.'
          }
          $wanted = New-Object System.Collections.Generic.List[string]
          foreach ($prefix in @('geosite', 'geoip')) {
            foreach ($m in [regex]::Matches($text, ('(?<=' + $prefix + ':)[A-Za-z0-9\-!]+'))) {
              $wanted.Add($prefix + '-' + $m.Value)
            }
          }
          $unavailable = @('geosite-gfw', 'geoip-telegram', 'geoip-private')
          $tags = @($wanted | Where-Object { $unavailable -notcontains $_ } | Sort-Object -Unique)
          if ($tags.Count -eq 0) {
            throw 'No rule-set tags could be derived from RoutingProfiles.cpp.'
          }
          $fetched = 0
          foreach ($tag in $tags) {
            $repo = if ($tag.StartsWith('geosite-')) { 'SagerNet/sing-geosite' } else { 'SagerNet/sing-geoip' }
            $url = 'https://raw.githubusercontent.com/' + $repo + '/rule-set/' + $tag + '.srs'
            $target = "$stage/rule-set/$tag.srs"
            try {
              Invoke-WebRequest -Uri $url -OutFile $target -MaximumRedirection 5
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $target) -or (Get-Item $target).Length -le 0) {
                throw 'Empty response.'
              }
              $fetched++
              Write-Host "offline bundle: $tag ($([math]::Round((Get-Item $target).Length / 1KB)) KB)"
            } catch {
              throw "Could not fetch $tag from $url -- upstream may have renamed it; add it to `$unavailable if it is gone for good."
            }
          }
          Write-Host "offline bundle: $fetched of $($tags.Count) rule-set tag(s)"

          $readme = @(
            'SongBird offline bundle (Windows, x64)',
            '',
            'Contains SongBird.exe, the sing-box core and the rule-set databases the',
            'built-in routing profiles reference. Nothing here runs on its own.',
            '',
            'Install: unpack this folder next to SongBird.exe. SongBird.exe finds the',
            'core next to itself, and sing-box reads rule-set/*.srs from the same',
            'directory instead of downloading them.',
            '',
            'The core directory is the package as upstream published it, so keep',
            'its files together: sing-box.exe imports libcronet.dll, and the',
            'LICENSE travels with it because the core is redistributed here.',
            '',
            'The core and rule-sets are still updatable afterwards through',
            'Settings > Core and Settings > Geodata.'
          )
          Set-Content -LiteralPath "$stage/README.txt" -Value $readme

          $name = 'SongBird-' + $version + '-offline-win-x64.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $name -Force
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('offline_asset=' + $name)
          Write-Host "offline bundle: staged $name ($([math]::Round((Get-Item $name).Length / 1MB)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: songbird-exe
          path: songbird.exe

      - name: Upload offline bundle artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: songbird-offline-bundle
          path: ${{ steps.stage-offline-bundle.outputs.offline_asset }}

      - name: Verify tag matches the embedded version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # A tag and the version the binary reports are two independent edits, and nothing used to
        # compare them: tagging v2.7.0 without bumping project(VERSION) published a release whose exe
        # says 2.6.0, and the About dialog, the update check and the release page then disagreed about
        # what the user is running. The check itself lives in scripts/ so the same rules run in ctest
        # (in-tree half) and here (with -Tag) instead of being spelled twice.
        run: |
          ./scripts/check-version-consistency.ps1 -Tag "${{ github.ref_name }}"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          # A tag carrying a suffix (v2.5.0-beta1) is a prerelease. Without this it would be
          # created as a normal release and become the repository's "Latest release" while
          # still a beta, which is what a visitor sees first.
          $createArgs = @('release', 'create', $tag, 'songbird.exe', '--title', "SongBird $version", '--generate-notes')
          if ($version -match '-') {
            $createArgs += '--prerelease'
          }
          gh @createArgs
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag songbird.exe --clobber
          }
          # The offline bundle is opt-in: the exe stays the primary asset, and it only
          # reaches the release together with the exe it belongs to.
          gh release upload $tag "${{ steps.stage-offline-bundle.outputs.offline_asset }}" --clobber

  # A macOS build cannot share the job above: that one is a vcpkg build whose cost is
  # dominated by a cache the macOS side has nothing to put in, and its Qt5 comes from
  # vcpkg's static ports. Here Qt5 comes from Homebrew instead, and Homebrew only publishes
  # per-architecture bottles -- neither Homebrew nor the official Qt 5.15.2 installer ships
  # a universal Qt5, so the two halves have to be built separately on their own runner and
  # merged in package-macos below. macos-15-intel is the x86_64 runner; macos-13 used to be
  # the obvious choice for that half, but it was retired in 2025 and macos-14 (arm64) is
  # already winding down, so macos-15 is used for arm64.
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # Both halves are needed for the universal bundle, but a failure in one should still
      # produce the log for the other rather than cancelling it.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt5
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # qt@5 is deprecated (2026-05-19) but not disabled, which happens a year later, so
          # it still installs and still prints a warning. It is used anyway because the
          # alternative is compiling Qt5 from source on every run.
          brew install qt@5
          command -v ninja >/dev/null || brew install ninja
          echo "QT_PREFIX=$(brew --prefix qt@5)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          # The top-level CMakeLists asks for Qt6 first and Qt5 second, so an installed
          # Homebrew "qt" (which is Qt6) would win over the qt@5 keg even with
          # CMAKE_PREFIX_PATH set. Excluding that prefix is what makes the choice
          # deterministic; the assertion below is what makes a wrong choice visible.
          qt6_prefix="$(brew --prefix qt 2>/dev/null || true)"
          ignore=()
          if [ -n "$qt6_prefix" ] && [ -d "$qt6_prefix" ]; then
            ignore=(-DCMAKE_IGNORE_PREFIX_PATH="$qt6_prefix")
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=OFF \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DSONGBIRD_ENABLE_UPX=OFF \
            "${ignore[@]}"

          if ! grep -q '^Qt5_DIR:' build/CMakeCache.txt; then
            echo "::error::Qt5 was not found; the build picked a different Qt than the one intended"
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt into the bundle
        run: |
          # Copies the frameworks the executable links to into Contents/Frameworks and
          # rewrites the install names to @executable_path, which is what turns the bundle
          # into something that runs on a machine without Homebrew.
          "$QT_PREFIX/bin/macdeployqt" build/src/SongBird.app -always-overwrite

      - name: Check the bundle is self-contained
        run: |
          # The check macdeployqt is trusted to have done. A leftover Homebrew path means
          # the application only starts on a machine with the same Homebrew prefix, which
          # is the failure that would otherwise only be discovered by a user.
          if otool -L build/src/SongBird.app/Contents/MacOS/SongBird | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::the executable still links against a Homebrew path"
            exit 1
          fi

      - name: Package the app bundle
        run: |
          # ditto rather than zip: it is the archiver that preserves the symlinks and
          # permission bits that a .app and its embedded frameworks are made of.
          ditto -c -k --sequesterRsrc --keepParent \
            build/src/SongBird.app "SongBird-${{ matrix.arch }}.app.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: songbird-macos-${{ matrix.arch }}
          path: SongBird-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  package-macos:
    name: macOS universal
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # Not for the sources -- this job only moves artifacts around and never builds
      # anything. It is here because gh infers the repository from the git remote, and a
      # job with no checkout has none: "gh run download" below and the release steps at
      # the bottom both fail with
      # "failed to run git: fatal: not a git repository (or any of the parent
      # directories): .git". The other two jobs check out for the same reason.
      - uses: actions/checkout@v7

      - name: Fetch both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh rather than actions/download-artifact: the CLI is already a dependency of
          # this workflow's release steps, and it avoids pinning a major version of an
          # action whose availability has not been checked here.
          for arch in arm64 x86_64; do
            gh run download "${{ github.run_id }}" -n "songbird-macos-$arch" -D "$arch"
            ditto -x -k "$arch/SongBird-$arch.app.zip" "$arch"
          done

      - name: Merge into a universal bundle
        run: |
          set -euo pipefail
          # The arm64 bundle is the skeleton and every Mach-O it contains is replaced by a
          # two-slice version built from its x86_64 counterpart. The two bundles have
          # identical layouts because they are the same build of the same sources, so a
          # path-relative lookup is enough to pair the files up.
          ditto arm64/SongBird.app universal/SongBird.app

          merged=0
          while IFS= read -r -d '' file; do
            relative="${file#universal/SongBird.app/}"
            counterpart="x86_64/SongBird.app/$relative"
            [ -f "$counterpart" ] || continue
            file -b "$file" | grep -q 'Mach-O' || continue
            lipo -create "$file" "$counterpart" -output "$file.merged"
            mv "$file.merged" "$file"
            merged=$((merged + 1))
          done < <(find universal/SongBird.app -type f -print0)

          echo "merged $merged Mach-O file(s)"
          # A zero here would mean the loop silently matched nothing and the "universal"
          # bundle is really just the arm64 one.
          test "$merged" -gt 0
          lipo -info universal/SongBird.app/Contents/MacOS/SongBird

      - name: Re-sign the merged bundle
        run: |
          set -euo pipefail
          app=universal/SongBird.app
          # lipo rewrites each Mach-O's contents, which invalidates whatever signature the
          # Homebrew build carried -- and macOS refuses to start an arm64 binary whose
          # signature does not cover it, so skipping this produces an application that
          # cannot be launched at all. Signing runs deepest first: signing a framework
          # before the binaries inside it would be undone by the next signature.
          #
          # Contents/MacOS is deliberately left out of this pass. codesign resolves a
          # bundle's main executable to the bundle itself, so signing it here asks for a
          # whole-bundle signature while every nested component is still unsigned, and it
          # fails with
          #   Contents/MacOS/SongBird: code object is not signed at all
          #   In subcomponent: .../Contents/PlugIns/printsupport/libcocoaprintersupport.dylib
          # -- which is what it did, because find happened to hand back the main executable
          # first. The bundle signature at the end is what covers the main executable.
          while IFS= read -r -d '' file; do
            file -b "$file" | grep -q 'Mach-O' || continue
            codesign --force --sign - --timestamp=none "$file"
          done < <(find "$app/Contents" -type f -not -path "$app/Contents/MacOS/*" -print0)
          while IFS= read -r -d '' framework; do
            codesign --force --sign - --timestamp=none "$framework"
          done < <(find "$app/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0)
          codesign --force --sign - --timestamp=none "$app"

          # The ad-hoc signature is not a substitute for Developer ID signing and
          # notarization: a downloaded copy still carries the quarantine attribute and has
          # to be opened through the right-click menu once. What it does buy is a bundle
          # whose signature is internally consistent, which is what arm64 requires.
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Build the DMG
        run: |
          set -euo pipefail
          mkdir -p dmg-root
          ditto universal/SongBird.app dmg-root/SongBird.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "SongBird" -srcfolder dmg-root -ov -format UDZO \
            SongBird-macos-universal.dmg
          shasum -a 256 SongBird-macos-universal.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: songbird-macos-universal
          path: SongBird-macos-universal.dmg
          if-no-files-found: error

      - name: Attach the DMG to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # The Windows job is what creates the release, and it is deliberately left as the
          # only creator so that a failure here cannot stop the Windows asset from being
          # published. The consequence is that the release may not exist yet when this runs.
          for attempt in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for the release to be created (attempt $attempt)"
            sleep 20
          done
          gh release upload "$tag" SongBird-macos-universal.dmg --clobber

