name: Release

on:
  push:
    # Tags publish a release. main builds do not publish; they exist so the
    # vcpkg cache is written under the default branch scope, which is the only
    # scope every tag ref can read from. Without this, each tag build starts
    # from a cold cache and recompiles Qt5 from source (~1.5h).
    branches:
      - main
    tags:
      - 'v*'
  # Keep-alive for the vcpkg cache. GitHub deletes cache entries that have not
  # been accessed in over 7 days, and its eviction checks now run hourly, so a
  # quiet month makes the next tag build pay the full ~1.5h Qt5 compile: the
  # 2026-08-17 run was followed by 5 idle weeks, and the next build took
  # 1h49m51s instead of the usual ~20 minutes. A weekly run sits exactly on the
  # 7-day boundary and scheduled runs are often delayed, so this fires twice a
  # week. Restoring the cache is what counts as an access.
  #
  # The run lands on the default branch, so the cache keeps the default-branch
  # scope tag builds read from, and "Publish GitHub release" stays skipped
  # because the ref is not a tag. It doubles as a weekly build-and-test check of
  # main. GitHub disables scheduled workflows after 60 days without repository
  # activity, which is also when a stale cache stops costing anything.
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

# One build per ref. Never cancel in progress: a killed run loses the vcpkg
# cache save, which costs ~1.5h of Qt5 compilation on the next run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_TRIPLET: x64-windows-static-md
  # Cache compiled vcpkg packages between runs; the first run builds Qt5 from
  # source and is slow, later runs restore from this directory.
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-qt5-${{ env.VCPKG_TRIPLET }}-${{ runner.os }}-v1
          restore-keys: |
            vcpkg-qt5-${{ env.VCPKG_TRIPLET }}-${{ runner.os }}-

      - name: Install ripgrep
        # Optional: scripts/check-backend-boundaries.ps1 uses rg when it is
        # available and otherwise falls back to an equivalent pure-PowerShell
        # scan, so this only speeds the boundary check up on the runner.
        run: choco install ripgrep -y --no-progress

      - name: Install Qt5 (static)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_cache" | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "qt5-base:$env:VCPKG_TRIPLET" `
            "qt5-svg:$env:VCPKG_TRIPLET"

      - name: Save vcpkg cache
        # Save right after the expensive Qt5 build, and even when a later step
        # fails, so a failed run does not discard hours of compilation.
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-qt5-${{ env.VCPKG_TRIPLET }}-${{ runner.os }}-v1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TEST=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -LE smoke --output-on-failure

      - name: Stage release asset
        shell: pwsh
        run: Copy-Item build/src/SongBird.exe songbird.exe -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: songbird-exe
          path: songbird.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          gh release create $tag songbird.exe --title "SongBird $version" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag songbird.exe --clobber
          }
