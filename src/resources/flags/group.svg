<!-- The location-grouping toggle's glyph, drawn at its target size: the button's iconSize is
     16x16 and this viewBox is 16x16, so AppTheme::accentSvgIcon renders a 16x16 pixmap and the
     icon paints 1:1 with no scaling pass (a 24-grid source scaled down was what produced
     anti-aliased halos that read as borders around the squares). Four solid squares (5x5, 2px
     gaps: 2+5+2+5+2 = 16), no corner radius, no stroke, tinted with the palette accent
     (currentColor). -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
	<g fill="currentColor">
		<rect x="2" y="2" width="5" height="5" />
		<rect x="9" y="2" width="5" height="5" />
		<rect x="2" y="9" width="5" height="5" />
		<rect x="9" y="9" width="5" height="5" />
	</g>
</svg>
