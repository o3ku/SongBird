# CNB 流水线：与 .github/workflows 对齐的测试门禁。
#
# 为什么用 Linux + 发行版 Qt5，而不是照抄 release.yml 的静态 Qt5：
# release.yml 现在装的是 x64-windows-static-md 的**预编译 vcpkg 安装根**，那是 MSVC
# 产物，Linux 上根本用不了；在 Linux 上照抄就得自己从源码编 Qt5，而 CNB 的节点缓存是
# 节点本地的 copy-on-write 缓存，跨节点不保证命中，于是又会得到一个动不动就一小时的
# 验证流程。（这条理由以前是「release.yml 的成本几乎全在 vcpkg 缓存上」，预编译包之后
# 连那份成本也没有了，但「Windows MSVC 的 Qt 不能拿来编 Linux」这层永远成立。）
# 这里要回答的是「这次改动能不能过」，不是「发布产物长什么样」——
# 后者仍然只由 GitHub Actions 负责，本文件不碰产物、不发布。
#
# 与 release.yml / macos-verify.yml 的对应关系：
#   ctest -LE smoke        两边都有（smoke 用例要真连网跑内核，不进验证流程）
#   scripts/check-*.ps1    这里跑的是 scripts/python/ 的等价移植版（见下面「静态守卫」那段）。
#                          规则一条不少，实现从 PowerShell 换成纯标准库 Python，因为 Debian
#                          装不上 PowerShell，而 PR 门禁不该因此少一层。
#   --version + 启动即退出 对应 macos-verify 的 smoke-run
#
# 注释用中文，因为这套配置只有本仓库的人看；脚本内容保持与 .github 一致的英文，
# 将来两边合并格式时不至于再多翻译一次。

# 依赖。
#
# 管线不写 docker.image，直接用 CNB 的默认构建镜像，各 stage 因此在同一个容器里执行，
# 装好的依赖和构建产物都在。依赖装在 job 里而不是维护一个自定义镜像，
# 是因为这套依赖很少变，为它多一个 Dockerfile 和一次镜像推送不划算。
#
# 两点是实测出来的，不是查文档抄的：
#   - qtbase5-dev 提供 Qt5 头文件和 CMake 包，qtbase5-dev-tools 才有 moc/uic/rcc；
#     少了它 CMake 会在 AUTOMOC 阶段报「找不到 moc」。
#   - qttools5-dev-tools 才有 lupdate。Debian 的 /usr/bin/lupdate 只是个 qtchooser 转发器，
#     没装这个包时它报 "could not exec '/usr/lib/qt5/bin/lupdate'"，而
#     check-localization-coverage.ps1 把它当成退出码 1 的失败。
#
# 这里不装 PowerShell。它在 Debian 上只存在于微软的发行源，而那条源在 apt 2.6 起已经加不上：
# Microsoft 的 InRelease 与它自己的包元数据由同一把只带 SHA1 自签的密钥签出，sqv 直接拒绝
# （"... requiring second pre-image resistance ... SHA1 is not considered secure"），
# update 以 100 退出。把公钥塞进 trusted.gpg.d 也只是把判定换了个位置——签名还是一样的。
# 见下面「静态守卫」。
.deps: &deps |
  set -euo pipefail
  apt-get update
  DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
    build-essential cmake ninja-build ca-certificates \
    qtbase5-dev qtbase5-dev-tools libqt5svg5-dev qttools5-dev-tools \
    python3
  cmake --version | head -1
  g++ --version | head -1
  lupdate -version 2>&1 | head -1 || true

# 静态守卫：跑的是 scripts/python/ 下那套 Python 移植版，不是 .ps1。
#
# 背景：那批规则原本只有 PowerShell 实现，而 PowerShell 在 Debian 上装不了——它只存在于微软的
# 发行源，那条源在 apt 2.6 起验签不过（Microsoft 的 InRelease 与它自己的包元数据由同一把只带
# SHA1 自签的密钥签出，sqv 直接拒绝），update 以 100 退出。把公钥塞进 trusted.gpg.d 也没用：
# 它要信任的签名带着同一个被政策拒绝的自签。于是这条流水线的 PR 门禁曾经一条守卫都不跑——那是
# 一个已知缺口，不是能靠注释补上的东西。
#
# 补法是换实现而不是换发行源：scripts/python/ 下每条规则一份纯标准库 Python，与 .ps1 逐条对应，
# 不需要装任何东西、不动信任链。.ps1 照旧保留，Windows 本机和 release.yml 仍在跑它们；两份实现
# 同源同规则，改规则时一起改。
#
# 覆盖边界要说清楚：
#   - 语言规则（分层、析构顺序、async 归属、颜色、本地化、Q_OS_* 作用域、README 资产、版本一致性）
#     只读源码，两边等价。
#   - translations-fresh 的「byte-exact 重编」那半要 lrelease；这里没有就响亮地跳过，recorded
#     哈希那半照跑，而它正是拦住「改了 .ts 忘了 lrelease」的那一半。装上 lrelease（Debian 的
#     qttools5-dev-tools 带它）之后两半都跑。
#   - translations-embedded 要看构建产物（translations.qrc + 链接好的可执行文件），
#     test-suites-nonempty 要重跑每个测试二进制。两者都靠下面 -D 传进来的构建目录注册，
#     所以它们在有构建的这条流水线里跑，在裸 configure 里不会被假装跑过。
#   - py-guard-selftest 是这套检查的自检：把每条规则在临时副本里破坏一次，断言它真的会红，
#     再断言未改动副本全绿。规则能红才叫规则，绿不下来的自检同样算失败。
#     （它自己带 guard 标签，不进默认 ctest 运行，跟 .ps1 那份一致。）

# 构建。
#
# 两个 -D 是给静态守卫用的：它们要看构建产物、要重跑测试二进制，都得知道构建目录在哪。
# 写成构建目录的绝对路径而不是相对路径，因为 ctest 的工作目录是 build/tests。
.build: &build |
  set -euo pipefail
  cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=ON \
    -DSONGBIRD_PYTHON_GUARD_EMBEDDED_BUILD_DIR="$PWD/build" \
    -DSONGBIRD_PYTHON_GUARD_SUITE_BUILD_DIR="$PWD/build"
  cmake --build build --parallel "$(nproc)"

# -LE smoke 与 release.yml / macos-verify.yml 一致。
# tests/CMakeLists.txt 会按平台把 QT_QPA_PLATFORM=offscreen 写进每条 ctest 的环境，
# 所以这里不需要 Xvfb。
.test: &test |
  set -euo pipefail
  ctest --test-dir build -LE smoke --output-on-failure

# 应用真的能起来，对应 macos-verify.yml 的 smoke-run：
# --skip-core 不探测内核，--disable-single-instance 不抢单实例锁，
# --non-interactive 不弹阻塞对话框，--quit-after-ms 让它自己退出。
# main() 返回 app.exec()，所以退出码 0 意味着窗口、启动序列和关闭流程都走完了。
# 在临时目录里跑，免得配置文件和日志写进工作区。
.smoke: &smoke |
  set -euo pipefail
  offscreen=QT_QPA_PLATFORM=offscreen
  # 二进制先用绝对路径找出来再切目录：下面要进临时目录跑，免得配置文件和日志落进工作区，
  # 而 --version 还留在原地执行（它不写任何东西）。
  app="${CNB_BUILD_WORKSPACE:-/workspace}/build/src/SongBird"
  env $offscreen "$app" --version | tee version.txt
  workdir="$(mktemp -d)"
  trap 'rm -rf "$workdir"' EXIT
  cd "$workdir"
  env $offscreen timeout 120 "$app" --skip-core --disable-single-instance --non-interactive --quit-after-ms 3000

# 一条可复用的流水线，push 和 pull_request 都用它。
# 四个 stage 共用一个容器：依赖装一次，构建产物交给 test 和 smoke-run 用。
.pipeline: &pipeline
  name: build-and-test
  runner:
    tags: cnb:arch:amd64
    cpus: 8
  stages:
    - name: dependencies
      script: *deps
      timeout: 20m
    - name: build
      script: *build
      timeout: 45m
    - name: test
      script: *test
      timeout: 30m
    - name: smoke-run
      script: *smoke
      timeout: 10m

main:
  push:
    - <<: *pipeline
  pull_request:
    - <<: *pipeline

# 其他分支：PR 门禁只在 main 上的 PR 事件里跑，
# 但 feature 分支自己 push 一次也要能验证，否则就得先开 PR 才知道红不红。
$:
  push:
    - <<: *pipeline
