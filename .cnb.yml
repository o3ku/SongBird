# CNB 流水线：与 .github/workflows 对齐的测试门禁。
#
# 为什么用 Linux + 发行版 Qt5，而不是照抄 release.yml 的 vcpkg 静态 Qt5：
# release.yml 的成本几乎全在 vcpkg 缓存上（冷启动要从源码编译 Qt5，约 1.5 小时），
# 而 CNB 的节点缓存是节点本地的 copy-on-write 缓存，跨节点不保证命中。
# 把 release 那套搬过来，会得到一个动不动就一小时的验证流程。
# 这里要回答的是「这次改动能不能过」，不是「发布产物长什么样」——
# 后者仍然只由 GitHub Actions 负责，本文件不碰产物、不发布。
#
# 与 release.yml / macos-verify.yml 的对应关系：
#   ctest -LE smoke        两边都有（smoke 用例要真连网跑内核，不进验证流程）
#   scripts/check-*.ps1    这里没有（见下面「静态守卫」那段）；它们只在 GitHub 的
#                          tag 构建和 main push 里跑，PR 门禁不覆盖
#   --version + 启动即退出 对应 macos-verify 的 smoke-run
#
# 注释用中文，因为这套配置只有本仓库的人看；脚本内容保持与 .github 一致的英文，
# 将来两边合并格式时不至于再多翻译一次。

# 依赖。
#
# 管线不写 docker.image，直接用 CNB 的默认构建镜像，各 stage 因此在同一个容器里执行，
# 装好的依赖和构建产物都在。依赖装在 job 里而不是维护一个自定义镜像，
# 是因为这套依赖很少变，为它多一个 Dockerfile 和一次镜像推送不划算。
#
# 两点是实测出来的，不是查文档抄的：
#   - qtbase5-dev 提供 Qt5 头文件和 CMake 包，qtbase5-dev-tools 才有 moc/uic/rcc；
#     少了它 CMake 会在 AUTOMOC 阶段报「找不到 moc」。
#   - qttools5-dev-tools 才有 lupdate。Debian 的 /usr/bin/lupdate 只是个 qtchooser 转发器，
#     没装这个包时它报 "could not exec '/usr/lib/qt5/bin/lupdate'"，而
#     check-localization-coverage.ps1 把它当成退出码 1 的失败。
#
# 这里不装 PowerShell。它在 Debian 上只存在于微软的发行源，而那条源在 apt 2.6 起已经加不上：
# Microsoft 的 InRelease 与它自己的包元数据由同一把只带 SHA1 自签的密钥签出，sqv 直接拒绝
# （"... requiring second pre-image resistance ... SHA1 is not considered secure"），
# update 以 100 退出。把公钥塞进 trusted.gpg.d 也只是把判定换了个位置——签名还是一样的。
# 见下面「静态守卫」。
.deps: &deps |
  set -euo pipefail
  apt-get update
  DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
    build-essential cmake ninja-build ca-certificates \
    qtbase5-dev qtbase5-dev-tools libqt5svg5-dev qttools5-dev-tools
  cmake --version | head -1
  g++ --version | head -1
  lupdate -version 2>&1 | head -1 || true

# 静态守卫：只在 Windows 上跑，因此 CNB 的 stage 里没有它们。
#
# 那些脚本用 Start-Process 拉起子进程并比对退出码（selftest-guards.ps1 就是靠这个把每条规则
# 破坏一次、看它是不是真的会红），而 PowerShell 只从微软的发行源装得到，那条源在 Debian 上
# 已经验签不过了（理由见 dependencies 那段）。硬装会得到一个红得毫无信息量的流水线。
#
# 所以这里的答案是不跑，而不是假装跑过。这不需要在下面额外关掉什么：
# tests/CMakeLists.txt 用 find_program(SONGBIRD_POWERSHELL_EXECUTABLE NAMES pwsh powershell)
# 决定要不要注册这些用例，这里没有 pwsh 就整块不注册，ctest 也就不会报「缺命令」。代价要说清楚：
# 这些守卫在 GitHub 的 tag 构建（release.yml 的 build job）和 main push（macos-verify.yml）里
# 一条不少地跑着，但那两个流程都不是 PR 门禁——前者由 v* tag 和 main push 触发，后者由 main
# push 触发。也就是说，PR 门禁现在只剩 CNB 这一条，而它不跑守卫。守卫今天只在开发者本机的
# BUILD_TEST=ON 构建里拦得住东西。这是已知缺口，不是靠这段注释能补上的。
.build: &build |
  set -euo pipefail
  cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=ON
  cmake --build build --parallel "$(nproc)"

# -LE smoke 与 release.yml / macos-verify.yml 一致。
# tests/CMakeLists.txt 会按平台把 QT_QPA_PLATFORM=offscreen 写进每条 ctest 的环境，
# 所以这里不需要 Xvfb。
.test: &test |
  set -euo pipefail
  ctest --test-dir build -LE smoke --output-on-failure

# 应用真的能起来，对应 macos-verify.yml 的 smoke-run：
# --skip-core 不探测内核，--disable-single-instance 不抢单实例锁，
# --non-interactive 不弹阻塞对话框，--quit-after-ms 让它自己退出。
# main() 返回 app.exec()，所以退出码 0 意味着窗口、启动序列和关闭流程都走完了。
# 在临时目录里跑，免得配置文件和日志写进工作区。
.smoke: &smoke |
  set -euo pipefail
  offscreen=QT_QPA_PLATFORM=offscreen
  # 二进制先用绝对路径找出来再切目录：下面要进临时目录跑，免得配置文件和日志落进工作区，
  # 而 --version 还留在原地执行（它不写任何东西）。
  app="${CNB_BUILD_WORKSPACE:-/workspace}/build/src/SongBird"
  env $offscreen "$app" --version | tee version.txt
  workdir="$(mktemp -d)"
  trap 'rm -rf "$workdir"' EXIT
  cd "$workdir"
  env $offscreen timeout 120 "$app" --skip-core --disable-single-instance --non-interactive --quit-after-ms 3000

# 一条可复用的流水线，push 和 pull_request 都用它。
# 四个 stage 共用一个容器：依赖装一次，构建产物交给 test 和 smoke-run 用。
.pipeline: &pipeline
  name: build-and-test
  runner:
    tags: cnb:arch:amd64
    cpus: 8
  stages:
    - name: dependencies
      script: *deps
      timeout: 20m
    - name: build
      script: *build
      timeout: 45m
    - name: test
      script: *test
      timeout: 30m
    - name: smoke-run
      script: *smoke
      timeout: 10m

main:
  push:
    - <<: *pipeline
  pull_request:
    - <<: *pipeline

# 其他分支：PR 门禁只在 main 上的 PR 事件里跑，
# 但 feature 分支自己 push 一次也要能验证，否则就得先开 PR 才知道红不红。
$:
  push:
    - <<: *pipeline
